<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>یادبود</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
      background: #111 url("background.jpg") center center / cover no-repeat fixed;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .58);
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      width: min( min(92vw, 760px), 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      display: block;
      width: 100%;
      max-height: 78vh;
      max-height: 78dvh;
      height: auto;
      object-fit: contain;
      background: #111;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    @media (max-width: 600px) {
      main { width: 94vw; }
      video { max-height: 72vh; max-height: 72dvh; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <video controls playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4">
      مرورگر شما از پخش ویدئو پشتیبانی نمی‌کند.
    </video>
  </main>
</body>
</html>
